name: Update Yoco to v0.5.1

on:
  push:
    paths:
      - .github/workflows/update-yoco-051.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-yoco-icon
      - name: Patch Yoco metadata and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/extensions.ts')
          s = p.read_text()

          s = s.replace('version: "0.5.0",\n  download_url:\n    "https://github.com/demassimo/Yoco_Payment_Gateway_Fossbilling/releases/download/v0.5.0/Yoco.zip",',
                        'version: "0.5.1",\n  download_url:\n    "https://github.com/demassimo/Yoco_Payment_Gateway_Fossbilling/releases/download/v0.5.1/Yoco-v0.5.1.zip",', 1)

          old_release = '''    {
      tag: "0.5.0",
      date: "2026-05-07T18:53:00Z",
      download_url:
        "https://github.com/demassimo/Yoco_Payment_Gateway_Fossbilling/releases/download/v0.5.0/Yoco.zip",
      changelog_url:
        "https://github.com/demassimo/Yoco_Payment_Gateway_Fossbilling/releases/tag/v0.5.0",
      min_fossbilling_version: "0.7",
    },'''
          new_release = '''    {
      tag: "0.5.1",
      date: "2026-05-10T00:00:00Z",
      download_url:
        "https://github.com/demassimo/Yoco_Payment_Gateway_Fossbilling/releases/download/v0.5.1/Yoco-v0.5.1.zip",
      changelog_url:
        "https://github.com/demassimo/Yoco_Payment_Gateway_Fossbilling/releases/tag/v0.5.1",
      min_fossbilling_version: "0.7",
    },
''' + old_release
          if old_release not in s:
              raise SystemExit('Could not find Yoco v0.5.0 release block')
          s = s.replace(old_release, new_release, 1)

          s = s.replace('"https://raw.githubusercontent.com/demassimo/Yoco_Payment_Gateway_Fossbilling/main/data/assets/gateways/yoco.png"',
                        '"https://raw.githubusercontent.com/demassimo/Yoco_Payment_Gateway_Fossbilling/main/assets/yoco-icon.svg"', 1)

          p.write_text(s)
          Path('.github/workflows/update-yoco-051.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "demassimo"
          git config user.email "87481244+demassimo@users.noreply.github.com"
          git add data/extensions.ts .github/workflows/update-yoco-051.yml
          git commit -m "Update Yoco extension icon and version"
          git push origin HEAD:update-yoco-icon
